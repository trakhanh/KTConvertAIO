[package]
name = "ktconvert"
version = "0.1.2"
description = "Zero-click file converter for Windows"
authors = ["Khánh Trà"]
repository = "https://github.com/trakhanh/KTConvertAIO"
edition = "2021"

[lib]
name = "ktconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# Thin LTO: nearly the same binary size, far less memory and time at link than full LTO.
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
